<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10秒ごとに喋るタイマー</title>
  <style>
    body {
      margin: 0;
      background: #0f1115;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: white;
      padding: 12px;
    }

    .app {
      width: 300px;
      background: #1b2130;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .title {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .display {
      font-size: 40px;
      margin-bottom: 15px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .inputs {
      margin-bottom: 12px;
    }

    input {
      width: 60px;
      padding: 8px;
      margin: 4px;
      border-radius: 8px;
      border: none;
      text-align: center;
      font-size: 16px;
    }

    .buttons {
      margin-bottom: 12px;
    }

    button {
      margin: 5px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-btn { background: #4caf50; color: white; }
    .pause-btn { background: orange; color: black; }
    .reset-btn { background: gray; color: white; }

    .speech {
      margin-top: 10px;
      font-size: 13px;
      background: #111;
      padding: 10px;
      border-radius: 10px;
      min-height: 50px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">10秒ごとに喋るタイマー</div>

    <div class="display" id="display">00:01:00</div>

    <div class="inputs">
      <input id="hours" type="number" min="0" max="23" value="0">時
      <input id="minutes" type="number" min="0" max="59" value="1">分
      <input id="seconds" type="number" min="0" max="59" value="0">秒
    </div>

    <div class="buttons">
      <button class="start-btn" id="startBtn">開始</button>
      <button class="pause-btn" id="pauseBtn">停止</button>
      <button class="reset-btn" id="resetBtn">リセット</button>
    </div>

    <div class="speech" id="speech">ここにしゃべります</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const display = document.getElementById("display");
      const speech = document.getElementById("speech");
      const hoursInput = document.getElementById("hours");
      const minutesInput = document.getElementById("minutes");
      const secondsInput = document.getElementById("seconds");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");

      let timerId = null;
      let totalSeconds = 60;
      let running = false;

      const lines = [
        "ちゃんとやってる？",
        "今の10秒、価値あった？",
        "集中切れてない？",
        "その手止まってない？",
        "未来変わってるよ、その10秒で",
        "ナイス、そのままいけ",
        "ちょっと疲れてきた？まだいける",
        "ここでやめたら普通だよ",
        "続けてる人だけ勝つんよ",
        "その調子、えらい"
      ];

      function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, "0");
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function getInputSeconds() {
        const h = parseInt(hoursInput.value, 10) || 0;
        const m = parseInt(minutesInput.value, 10) || 0;
        const s = parseInt(secondsInput.value, 10) || 0;
        return h * 3600 + m * 60 + s;
      }

      function updateDisplay() {
        display.textContent = formatTime(totalSeconds);
      }

      function say(text) {
        speech.textContent = text;

        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        window.speechSynthesis.speak(utterance);
      }

      function stopTimerOnly() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        running = false;
      }

      function startTimerApp() {
        if (running) return;

        if (totalSeconds <= 0) {
          totalSeconds = getInputSeconds();
          if (totalSeconds <= 0) totalSeconds = 1;
        }

        running = true;
        say("スタート");

        timerId = setInterval(() => {
          totalSeconds--;
          updateDisplay();

          if (totalSeconds > 0 && totalSeconds <= 10) {
            say(`${totalSeconds}秒`);
          } else if (totalSeconds > 0 && totalSeconds % 10 === 0) {
            const text = lines[Math.floor(Math.random() * lines.length)];
            say(text);
          }

          if (totalSeconds <= 0) {
            stopTimerOnly();
            totalSeconds = 0;
            updateDisplay();
            say("終了。やったな。");
          }
        }, 1000);
      }

      function pauseTimerApp() {
        stopTimerOnly();
        say("停止");
      }

      function resetTimerApp() {
        stopTimerOnly();
        totalSeconds = getInputSeconds();
        if (totalSeconds <= 0) totalSeconds = 1;
        updateDisplay();
        say("リセット");
      }

      startBtn.addEventListener("click", startTimerApp);
      pauseBtn.addEventListener("click", pauseTimerApp);
      resetBtn.addEventListener("click", resetTimerApp);

      totalSeconds = getInputSeconds();
      if (totalSeconds <= 0) totalSeconds = 1;
      updateDisplay();
    });
  </script>
</body>
</html>
