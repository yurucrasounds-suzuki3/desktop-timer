<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>こどもカウントダウン</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #6d5dfc;
      --accent: #ff7aa2;
      --text-main: #5b4b4b;
      --surface: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #fff7d6 0%, #ffe9f3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #5b4b4b;
    }

    .app {
      width: 340px;
      max-width: 100%;
      background: var(--surface);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
      border: 4px solid #ffe08a;
      display: grid;
      gap: 12px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 13px;
      color: #8d7f7f;
      margin-bottom: 4px;
    }

    .header {
      display: grid;
      gap: 4px;
    }

    .character {
      font-size: 54px;
      margin-bottom: 2px;
    }

    .display-wrap {
      background: #fff8fb;
      border: 3px dashed #ffc6da;
      border-radius: 22px;
      padding: 14px 10px 10px;
    }

    .display {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }

    .progress-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #ebe8ff;
      overflow: hidden;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6d5dfc 0%, #9a88ff 100%);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
      font-weight: 700;
      color: #7768ff;
      min-width: 36px;
      text-align: right;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 700;
      color: #8a7b7b;
    }

    .input-group input {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: #f6f7ff;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #5b4b4b;
      outline: none;
      border: 2px solid #dfe3ff;
    }

    .input-group input:focus {
      border-color: #b8b0ff;
      box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.16);
    }

    .preset-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-btn {
      background: #fff5ec;
      color: #84512d;
      border: 2px solid #ffe0c2;
      border-radius: 14px;
      padding: 9px 4px;
      font-size: 13px;
      font-weight: 800;
    }

    .mode-box {
      text-align: left;
    }

    .mode-box label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #8a7b7b;
    }

    .mode-box select {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: #f6fff6;
      border: 2px solid #d6f0d6;
      padding: 0 12px;
      font-size: 16px;
      color: #5b4b4b;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 13px 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      filter: brightness(1.03);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      filter: grayscale(0.12);
      transform: none;
    }

    .start-btn {
      background: #7ad97a;
      color: #fff;
    }

    .pause-btn {
      background: #ffd36e;
      color: #6a5600;
    }

    .reset-btn {
      background: #9db4ff;
      color: #fff;
    }

    .speech {
      background: #fff8e7;
      border: 3px solid #ffe08a;
      border-radius: 18px;
      padding: 14px;
      min-height: 74px;
      font-size: 17px;
      line-height: 1.6;
      font-weight: 700;
      color: #6b5b4b;
      position: relative;
    }

    .speech::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 28px;
      width: 20px;
      height: 20px;
      background: #fff8e7;
      border-left: 3px solid #ffe08a;
      border-top: 3px solid #ffe08a;
      transform: rotate(45deg);
    }

    .status {
      font-size: 12px;
      color: #9b8d8d;
      min-height: 18px;
    }

    .finished {
      animation: bounce 0.7s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="character" id="character">🐻</div>
    <div class="header">
      <div class="title">こどもカウントダウン</div>
      <div class="subtitle">おしたく・おかたづけ・はみがきに</div>
    </div>

    <div class="display-wrap">
      <div class="display" id="display">00:01:00</div>
      <div class="progress-wrap">
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">100%</div>
      </div>
    </div>

    <div class="inputs">
      <div class="input-group">
        <label for="hours">じ</label>
        <input id="hours" type="number" min="0" max="23" value="0" />
      </div>
      <div class="input-group">
        <label for="minutes">ふん</label>
        <input id="minutes" type="number" min="0" max="59" value="1" />
      </div>
      <div class="input-group">
        <label for="seconds">びょう</label>
        <input id="seconds" type="number" min="0" max="59" value="0" />
      </div>
    </div>

    <div class="preset-box">
      <button class="preset-btn" type="button" data-seconds="60">1ぷん</button>
      <button class="preset-btn" type="button" data-seconds="180">3ぷん</button>
      <button class="preset-btn" type="button" data-seconds="300">5ぷん</button>
    </div>

    <div class="mode-box">
      <label for="scene">どんなとき？</label>
      <select id="scene">
        <option value="cleanup">おかたづけ</option>
        <option value="sleep">ねるまえのじゅんび</option>
        <option value="teeth">はみがき</option>
        <option value="bath">おふろ</option>
        <option value="goout">おでかけじゅんび</option>
      </select>
    </div>

    <div class="buttons">
      <button class="start-btn" id="startBtn">スタート</button>
      <button class="pause-btn" id="pauseBtn">とめる</button>
      <button class="reset-btn" id="resetBtn">もどす</button>
    </div>

    <div class="speech" id="speech">いっしょに がんばろう！</div>
    <div class="status" id="status">たいきちゅう</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const app = document.getElementById("app");
      const display = document.getElementById("display");
      const speech = document.getElementById("speech");
      const statusText = document.getElementById("status");
      const character = document.getElementById("character");
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");
      const presetButtons = Array.from(document.querySelectorAll(".preset-btn"));

      const hoursInput = document.getElementById("hours");
      const minutesInput = document.getElementById("minutes");
      const secondsInput = document.getElementById("seconds");
      const sceneSelect = document.getElementById("scene");

      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");

      let timerId = null;
      let totalSeconds = 60;
      let running = false;
      let startSeconds = 60;
      let currentAudio = null;

      const sceneData = {
        cleanup: {
          icon: "🧸",
          startText: "おかたづけ、スタートだよ。いっしょにやってみよう！",
          finishText: "おしまい！おかたづけできたかな？ すごいね！",
          linesText: [
            "おもちゃさんを おうちに かえしてあげよう。",
            "ひとつずつで だいじょうぶだよ。",
            "あとすこし、がんばれー！",
            "できてるできてる、いいかんじ！",
            "まずは ちかくの ひとつから しまってみよう。"
          ],
          startSound: "sounds/「スタート」.mp3",
          finishSound: "sounds/「終了」.mp3",
          lineSounds: [
            "sounds/「がんばれー」.mp3",
            "sounds/「すごいすごい」.mp3",
            "sounds/「その調子その調子！」.mp3",
            "sounds/「フレーフレー」.mp3",
            "sounds/「合格です」.mp3",
            "sounds/「よぉーい…」.mp3",
            "sounds/「あとちょっと～！」.mp3",
            "sounds/「頑張って！」.mp3"
          ]
        },
        sleep: {
          icon: "🌙",
          startText: "ねるまえの じゅんび、はじめるよ。ゆっくりで だいじょうぶ。",
          finishText: "じゅんび おしまい。おやすみの じかんだね。",
          linesText: [
            "ねるじゅんび、じょうずに できてるよ。",
            "おへやを しずかモードに しよう。",
            "おやすみに むかって すすんでるよ。",
            "あとちょっとで きらきら ねるじかん。",
            "ゆっくり、ひとつずつ やってみよう。"
          ],
          startSound: "sounds/「スタート」.mp3",
          finishSound: "sounds/「終了」.mp3",
          lineSounds: [
            "sounds/「がんばれー」.mp3",
            "sounds/「すごいすごい」.mp3",
            "sounds/「その調子その調子！」.mp3",
            "sounds/「フレーフレー」.mp3",
            "sounds/「合格です」.mp3",
            "sounds/「よぉーい…」.mp3",
            "sounds/「あとちょっと～！」.mp3",
            "sounds/「頑張って！」.mp3"
          ]
        },
        teeth: {
          icon: "🪥",
          startText: "はみがきタイム、スタート！ ぴかぴかに しよう！",
          finishText: "おしまい！おくち ぴかぴかだね！",
          linesText: [
            "しゃかしゃか、いいかんじ！",
            "まえの はも、おくの はも、みがいてみよう。",
            "ぴかぴか はみがき、かっこいい！",
            "あとちょっと、がんばろう！",
            "じょうず じょうず、そのちょうし！"
          ],
          startSound: "sounds/「スタート」.mp3",
          finishSound: "sounds/「終了」.mp3",
          lineSounds: [
            "sounds/「がんばれー」.mp3",
            "sounds/「すごいすごい」.mp3",
            "sounds/「その調子その調子！」.mp3",
            "sounds/「フレーフレー」.mp3",
            "sounds/「合格です」.mp3",
            "sounds/「よぉーい…」.mp3",
            "sounds/「あとちょっと～！」.mp3",
            "sounds/「頑張って！」.mp3"
          ]
        },
        bath: {
          icon: "🛁",
          startText: "おふろの じゅんび、スタート！",
          finishText: "おしまい！さっぱり きもちいいね！",
          linesText: [
            "おふろタイム、たのしく いこう！",
            "まずは いどうしてみよう。",
            "いいかんじ、すすんでるよ！",
            "あとちょっとで おふろだよ。",
            "じゅんびできたら すごい！"
          ],
          startSound: "sounds/「スタート」.mp3",
          finishSound: "sounds/「終了」.mp3",
          lineSounds: [
            "sounds/「がんばれー」.mp3",
            "sounds/「すごいすごい」.mp3",
            "sounds/「その調子その調子！」.mp3",
            "sounds/「フレーフレー」.mp3",
            "sounds/「合格です」.mp3",
            "sounds/「よぉーい…」.mp3",
            "sounds/「あとちょっと～！」.mp3",
            "sounds/「頑張って！」.mp3"
          ]
        },
        goout: {
          icon: "🎒",
          startText: "おでかけの じゅんび、はじめるよ！",
          finishText: "じゅんび できたかな？ しゅっぱつできそう！",
          linesText: [
            "くつした、ぼうし、もったかな？",
            "いっこずつ そろえていこう！",
            "じゅんび じょうずに できてるよ！",
            "あとちょっとで しゅっぱつ！",
            "わすれもの ないか みてみよう。"
          ],
          startSound: "sounds/「スタート」.mp3",
          finishSound: "sounds/「終了」.mp3",
          lineSounds: [
            "sounds/「がんばれー」.mp3",
            "sounds/「すごいすごい」.mp3",
            "sounds/「その調子その調子！」.mp3",
            "sounds/「フレーフレー」.mp3",
            "sounds/「合格です」.mp3",
            "sounds/「よぉーい…」.mp3",
            "sounds/「あとちょっと～！」.mp3",
            "sounds/「頑張って！」.mp3"
          ]
        }
      };

      function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, "0");
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function getInputSeconds() {
        const h = parseInt(hoursInput.value, 10) || 0;
        const m = parseInt(minutesInput.value, 10) || 0;
        const s = parseInt(secondsInput.value, 10) || 0;
        return h * 3600 + m * 60 + s;
      }

      function updateDisplay() {
        display.textContent = formatTime(totalSeconds);
      }

      function renderProgress() {
        const safeStart = Math.max(startSeconds, 1);
        const ratio = Math.min(Math.max(totalSeconds / safeStart, 0), 1);
        const percent = Math.round(ratio * 100);
        progressFill.style.width = `${percent}%`;
        progressText.textContent = `${percent}%`;
      }

      function updateButtonState() {
        startBtn.disabled = running;
        pauseBtn.disabled = !running;
      }

      function stopCurrentAudio() {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
      }

      function playSound(path) {
        if (!path) return;

        stopCurrentAudio();

        currentAudio = new Audio(path);
        currentAudio.play().catch((error) => {
          console.log("audio play error:", error);
        });
      }

      function randomIndex(length) {
        return Math.floor(Math.random() * length);
      }

      function applySceneUI() {
        const scene = sceneData[sceneSelect.value];
        character.textContent = scene.icon;
        speech.textContent = "いっしょに がんばろう！";
      }

      function stopTimerOnly() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        running = false;
        updateButtonState();
      }

      function startTimerApp() {
        if (running) return;

        if (totalSeconds <= 0) {
          totalSeconds = getInputSeconds();
          if (totalSeconds <= 0) totalSeconds = 1;
        }

        startSeconds = totalSeconds;
        running = true;
        updateButtonState();
        app.classList.remove("finished");
        statusText.textContent = "カウントちゅう";

        const scene = sceneData[sceneSelect.value];
        speech.textContent = scene.startText;
        playSound(scene.startSound);

        timerId = setInterval(() => {
          totalSeconds--;
          updateDisplay();
          renderProgress();

          if (totalSeconds > 0 && totalSeconds <= 10) {
            speech.textContent = `${totalSeconds}...`;
          } else if (
            totalSeconds > 0 &&
            totalSeconds % 20 === 0 &&
            totalSeconds !== startSeconds
          ) {
            const index = randomIndex(scene.lineSounds.length);
            speech.textContent = scene.linesText[index % scene.linesText.length];
            playSound(scene.lineSounds[index]);
          }

          if (totalSeconds <= 0) {
            stopTimerOnly();
            totalSeconds = 0;
            updateDisplay();
            renderProgress();
            app.classList.add("finished");
            statusText.textContent = "おしまい";
            speech.textContent = scene.finishText;
            playSound(scene.finishSound);
          }
        }, 1000);
      }

      function pauseTimerApp() {
        stopTimerOnly();
        stopCurrentAudio();
        statusText.textContent = "とまってるよ";
        speech.textContent = "いったん おやすみ。";
      }

      function resetTimerApp() {
        stopTimerOnly();
        stopCurrentAudio();
        totalSeconds = getInputSeconds();
        if (totalSeconds <= 0) totalSeconds = 1;
        startSeconds = totalSeconds;
        updateDisplay();
        renderProgress();
        app.classList.remove("finished");
        statusText.textContent = "たいきちゅう";
        speech.textContent = "じゅんび できたよ。";
      }

      startBtn.addEventListener("click", startTimerApp);
      pauseBtn.addEventListener("click", pauseTimerApp);
      resetBtn.addEventListener("click", resetTimerApp);

      sceneSelect.addEventListener("change", () => {
        applySceneUI();
        stopCurrentAudio();
      });

      [hoursInput, minutesInput, secondsInput].forEach((input) => {
        input.addEventListener("input", () => {
          stopTimerOnly();
          stopCurrentAudio();
          totalSeconds = getInputSeconds();
          if (totalSeconds <= 0) totalSeconds = 1;
          startSeconds = totalSeconds;
          updateDisplay();
          renderProgress();
          statusText.textContent = "たいきちゅう";
        });
      });

      presetButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const sec = parseInt(button.dataset.seconds, 10);
          if (!Number.isFinite(sec) || sec <= 0) return;

          stopTimerOnly();
          stopCurrentAudio();

          const h = Math.floor(sec / 3600);
          const m = Math.floor((sec % 3600) / 60);
          const s = sec % 60;
          hoursInput.value = String(h);
          minutesInput.value = String(m);
          secondsInput.value = String(s);

          totalSeconds = sec;
          startSeconds = sec;
          updateDisplay();
          renderProgress();
          statusText.textContent = "たいきちゅう";
          speech.textContent = "じゅんび できたよ。";
          app.classList.remove("finished");
        });
      });

      totalSeconds = getInputSeconds();
      if (totalSeconds <= 0) totalSeconds = 1;
      startSeconds = totalSeconds;
      updateDisplay();
      renderProgress();
      applySceneUI();
      updateButtonState();
    });
  </script>
</body>
</html>
